name: Feature request
description: Propose a focused product improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the developer workflow and desired outcome. Do not include credentials, private source, or proprietary logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What debugging workflow is hard today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What do you do today, and where does that workflow break down?
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Investigation and evidence
        - Checks and project health
        - Verification and Apply
        - Workspaces and recovery
        - AI providers and context
        - Sessions and capsules
        - Desktop interface
        - CLI and developer tooling
