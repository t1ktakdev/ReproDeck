version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Bishkek
    open-pull-requests-limit: 5
    groups:
      npm-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Asia/Bishkek
    open-pull-requests-limit: 5
    groups:
      cargo-non-major:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Asia/Bishkek
    open-pull-requests-limit: 3
    groups:
      actions-non-major:
        update-types:
          - minor
          - patch
