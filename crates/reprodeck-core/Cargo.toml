[package]
name = "reprodeck-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.34", features = ["bundled", "chrono", "uuid", "serde_json"] }
# Schema migrations use the rusqlite 0.34-compatible 2.x line.
rusqlite_migration = "2"

# Git
git2 = "0.20"

# Crypto / Hashing
sha2 = "0.10"
hex = "0.4"

# Regex / Redaction
regex = "1"

# HTTP client for AI
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "fs"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

walkdir = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
wait-timeout = "0.2"
directories = "5"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Pipes", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
once_cell = "1"
